/* --- dialogs --- */
const dlg = { s: 0, step: 0, log: [], order: [], done: false, wait: false, token: 0 };
function dlgStart(i, play) {
  const first = SCENES[i].steps[0].them;
  Object.assign(dlg, { s: i, step: 0, done: false, wait: false, log: [{ who: 'them', ...first }] });
  SCENES.forEach(sc => preload(sc.steps[0].them.th, sc.steps[0].them.v));
  dlg.order = shuffle(SCENES[i].steps[0].you.map((_, k) => k));
  $('#dlgWhy').textContent = '';
  renderDlg(); icons();
  if (play) speak(first.th, null, first.v);
}
// your replies: the voice opposite to the speaker
const dlgYouV = () => SCENES[dlg.s].steps[0].them.v === 'f' ? 'm' : 'f';
const dlgYouSay = o => o.th;
function dlgBubble(b) {
  const p = pt(b.th), tr = $('#dlgTr').checked;
  if (b.who === 'them') return `<div class="fade-up flex items-end gap-2 max-w-[88%]">
    <span class="grid place-items-center w-8 h-8 shrink-0 rounded-full bg-ink-800 border border-white/10 text-zinc-400"><i data-lucide="${voiceIcon(b.v)}" class="w-4 h-4"></i></span>

      <span class="font-thai text-lg text-white">${b.th}</span><span class="block font-mono text-xs text-accent">${b.lat}</span>
      ${tr ? `<span class="block mt-1 text-sm text-zinc-400">${b[lang]}</span>` : ''}</button></div>`;
  return `<div class="fade-up flex justify-end"><button data-say="${b.th}" data-voice="${dlgYouV()}" class="text-left max-w-[88%] rounded-2xl rounded-br-md bg-accent/15 border border-accent/30 px-4 py-3 hover:border-accent transition">
    <span class="font-thai text-lg text-white">${b.th}<span class="text-accent">${p.th}</span></span><span class="block font-mono text-xs text-accent">${b.lat} ${p.lat}</span>
    <span class="block mt-1 text-sm text-zinc-300">${b[lang]}</span></button></div>`;
}
function renderDlg() {
  const sc = SCENES[dlg.s], n = sc.steps.length;
  $('#sceneTabs').innerHTML = SCENES.map((x, i) => `<button data-scene="${i}" class="${chip(i === dlg.s)}"><i data-lucide="${x.icon}" class="w-3.5 h-3.5"></i>${x[lang]}</button>`).join('');
  $('#dlgProg').textContent = `${t('dlgStep')} ${Math.min(dlg.step + 1, n)} / ${n}`;
  $('#dlgLog').innerHTML = dlg.log.map(dlgBubble).join('');
  if (dlg.done) {
    $('#dlgOpts').innerHTML = `<div class="fade-up pop rounded-2xl border border-emerald-400/30 bg-emerald-400/5 p-6 text-center">
      <i data-lucide="party-popper" class="w-8 h-8 mx-auto text-emerald-400"></i><p class="mt-3 font-bold text-white">${t('dlgDone')}</p>
      <button data-scene="${(dlg.s + 1) % SCENES.length}" class="mt-4 inline-flex items-center gap-2 rounded-xl bg-accent px-4 py-2.5 text-sm font-semibold text-ink-950 hover:brightness-110 transition">${t('dlgNext')}<i data-lucide="arrow-right" class="w-4 h-4"></i></button></div>`;
    return;
  }
  if (dlg.wait) { $('#dlgOpts').innerHTML = `<div class="flex justify-start gap-1.5 pl-10 py-3">${[0, 1, 2].map(i => `<span class="w-2 h-2 rounded-full bg-zinc-600 animate-pulse" style="animation-delay:${i * 150}ms"></span>`).join('')}</div>`; return }
  const opts = sc.steps[dlg.step].you, nextStep = sc.steps[dlg.step + 1];
  opts.forEach(o => preload(dlgYouSay(o), dlgYouV()));
  if (nextStep) preload(nextStep.them.th, nextStep.them.v);
  $('#dlgOpts').innerHTML = `<p class="text-xs uppercase tracking-widest text-zinc-500">${t('dlgYou')}</p>` + dlg.order.map(i => { const o = opts[i]; return `
    <button data-opt="${i}" class="fade-up text-left rounded-xl border border-white/10 bg-ink-900 px-4 py-3 hover:border-accent/50 transition">
      <span class="font-thai text-lg text-white">${o.th}<span class="text-accent/70">${pt(o.th).th}</span></span>
      <span class="block font-mono text-xs text-accent">${o.lat} ${pt(o.th).lat}</span>
      <span class="block text-sm text-zinc-400">${o[lang]}</span></button>` }).join('');
}
function dlgTheirTurn(token) {
  if (token !== dlg.token || !dlg.wait) return;
  const st = SCENES[dlg.s].steps[dlg.step];

/* quiz */
const q = { score: 0, total: 0, streak: 0, cur: 0, opts: [], lock: false };
function qNext() {
  const n = items().length;
  q.cur = Math.random() * n | 0;
  q.opts = shuffle([q.cur, ...shuffle([...Array(n).keys()].filter(i => i !== q.cur)).slice(0, 3)]);
  q.lock = false;
  qRender();
}
function qRender() {
  const x = items()[q.cur];
  $('#qPrompt').innerHTML = `<div class="fade-up">
    <p class="text-sm text-zinc-500">${t('quizQ')}</p>

  $('#qOpts').innerHTML = q.opts.map(i => `<button data-q="${i}" class="fade-up rounded-xl border border-white/10 bg-ink-900 px-5 py-4 text-left font-medium hover:border-white/30 transition">${items()[i][lang]}</button>`).join('');

}
$('#qOpts').addEventListener('click', e => {
  const b = e.target.closest('[data-q]');
  if (!b || q.lock) return;
  q.lock = true; q.total++;
  const ok = +b.dataset.q === q.cur;
  ok ? (q.score++, q.streak++) : (q.streak = 0);
  $$('[data-q]').forEach(el => {
    if (+el.dataset.q === q.cur) el.className += ' !border-emerald-400 !bg-emerald-400/10 text-emerald-300 pop';
    else if (el === b) el.className += ' !border-rose-400 !bg-rose-400/10 text-rose-300 shake';
    else el.className += ' opacity-40';
  });
  $('#qScore').textContent = q.score; $('#qTotal').textContent = q.total; $('#qStreak').textContent = q.streak;
  setTimeout(qNext, ok ? 900 : 1600);

      if (spk.url) URL.revokeObjectURL(spk.url);
      spk.url = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType }));
      spRender(); icons();
      new Audio(spk.url).play();
    };
    rec.start(); spk.recording = true; spRender(); icons();
    setTimeout(() => rec.state === 'recording' && rec.stop(), 7000);
  } catch (e) { toast(t('spMicErr')) }
};
$('#spCheck').onclick = () => {
  if (!SR || spk.listening) return;
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5;
  r.onresult = e => {
    const target = say(PH[spk.i]);
    let best = { t: '', s: 0 };
    for (const a of e.results[0]) { const s = simil(a.transcript, target); if (s >= best.s) best = { t: a.transcript, s } }
    const pct = Math.round(best.s * 100), lvl = pct >= 85 ? 2 : pct >= 60 ? 1 : 0;
    const tone = ['border-rose-400/40 bg-rose-400/5 text-rose-300', 'border-accent/40 bg-accent/5 text-accent', 'border-emerald-400/40 bg-emerald-400/5 text-emerald-400'][lvl];
    $('#spResult').innerHTML = `<div class="fade-up ${lvl ? 'pop' : 'shake'} rounded-2xl border ${tone} p-5">
      <div class="flex items-center gap-4"><span class="font-mono text-4xl font-bold">${pct}%</span><p class="font-semibold text-white">${t('spR' + lvl)}</p></div>
      <p class="mt-3 text-sm text-zinc-500">${t('spHeard')}: <span class="font-thai text-white">${best.t || '—'}</span></p></div>`;
  };
  r.onerror = e => toast(e.error === 'not-allowed' ? t('spMicErr') : e.error === 'no-speech' ? t('spNothing') : t('spSrErr') + e.error);
  r.onend = () => { spk.listening = false; spRender(); icons() };
  spk.listening = true; spRender(); icons();
  r.start();
};

/* trainer tabs */
function renderTabs() {
  $$('.tab').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('bg-accent', on); b.classList.toggle('text-ink-950', on); b.classList.toggle('text-zinc-400', !on) });
  $$('[data-panel]').forEach(p => p.classList.toggle('hidden', p.dataset.panel !== tab));
  renderPools();
}
function openTab(name) {
  if (tab === name) return;
  tab = name; renderTabs();
  if (name === 'tones') speak(INT_DRILL[tn.cur].th, $('#tPlay'));
  if (name === 'listen') speak(ANS[lq.cur].th, $('#lPlay'), ANS[lq.cur].v);
}
$$('.tab').forEach(b => b.onclick = () => openTab(b.dataset.tab));
$$('[data-goto-tab]').forEach(b => b.onclick = () => { $('#train').scrollIntoView({ behavior: 'smooth' }); openTab(b.dataset.gotoTab) });

/* ================= TOGGLES & INIT ================= */
/* ================= MOBILE MENU ================= */
function navFill() {
  $('#navMenu > div').innerHTML = [...$$('header nav > div.lg\\:flex a')].map(a => `<a href="${a.getAttribute('href')}" class="rounded-lg px-3 py-2.5 text-zinc-300 hover:bg-white/5 hover:text-white transition">${a.textContent}</a>`).join('');
}
function navToggle(open = $('#navMenu').classList.contains('hidden')) {
  $('#navMenu').classList.toggle('hidden', !open);
  $('#navBtn').setAttribute('aria-expanded', open);
  $$('#navBtn .nav-closed').forEach(i => i.classList.toggle('hidden', open));
  $$('#navBtn .nav-opened').forEach(i => i.classList.toggle('hidden', !open));
}
$('#navBtn').onclick = e => { e.stopPropagation(); navToggle() };
$('#navMenu').addEventListener('click', e => e.target.closest('a') && navToggle(false));
document.addEventListener('click', e => !e.target.closest('header') && navToggle(false));
document.addEventListener('keydown', e => e.key === 'Escape' && navToggle(false));

function renderAll() {
  renderText(); renderSounds(); renderTones(); renderPoster(); renderAlphabet(); renderPhrases();
  renderNum(); renderBody(); renderVerbs(); renderQues(); renderCls(); renderFood(); renderSent(); renderTopVerbs(); renderHero(); renderPools();
  renderAns(); renderDlg(); renderEtq(); renderSigns(); lRender(); spRender(); renderMore(); renderTwisters(); renderFacts(); renderLearn(); navFill();
  fcShow(); qRender(); tRender(); trRender(); icons();
}
$$('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('tf-lang', lang); renderAll() });
$$('[data-gender]').forEach(b => b.onclick = () => { gender = b.dataset.gender; store.set('tf-gender', gender); renderAll() });

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }), { threshold: .08 });
$$('.reveal').forEach(el => io.observe(el));

deck = shuffle(items().map((_, i) => i));
qNext();
tNext(false);
lNext(false);
spk.i = Math.random() * PH.length | 0;
dlgStart(0, false);
renderTabs();
renderVtabs();
renderAll();
const audioIO = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  audioIO.unobserve(e.target);
  (window.requestIdleCallback || setTimeout)(() => e.target.querySelectorAll('[data-say]:not([data-say=""])').forEach(b => preloadIdle(b.dataset.say, b.dataset.voice)));
}), { rootMargin: '300px' });
$$('main > section').forEach(sec => audioIO.observe(sec));
// first screen right away: the phrase of the day now, the rest of its list in the background
preload(say(HERO[heroI]));
HERO.forEach(x => preloadIdle(say(x)));
</script>
